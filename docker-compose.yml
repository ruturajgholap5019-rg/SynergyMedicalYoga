version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: synergy_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: synergy_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/synergy_yoga
      - ACCESS_TOKEN_SECRET=synergy_super_secret_access_key_2026
      - REFRESH_TOKEN_SECRET=synergy_super_secret_refresh_key_2026
      - CLIENT_URL=http://localhost:5173
      - ADMIN_URL=http://localhost:5174
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174
    depends_on:
      - mongodb

  frontend:
    build: ./fontend
    container_name: synergy_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  admin:
    build: ./admin
    container_name: synergy_admin
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mongo_data:
